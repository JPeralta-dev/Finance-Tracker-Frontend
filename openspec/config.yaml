# openspec/config.yaml
# Last updated: 2026-07-28 (sdd-init refresh)
schema: spec-driven

context: |
  Tech stack: Angular 17.3 standalone, TypeScript 5.4 strict, TailwindCSS 3.4, SCSS
  Package manager: pnpm 9.15.4
  Architecture: Standalone components, lazy-loaded features, core/shared/features layering
    - Core: guards, interceptors, services, models, pipes, i18n
    - Features: auth, dashboard, transactions, categories, settings, profile, landing, referral
    - Shared: UI components, layout, icons, animations, directives, charts
  Build: @angular-devkit/build-angular:application (esbuild)
  Deploy: Vercel static build, SPA rewrites, nginx reverse-proxy ready
  State: Angular signals, HTTP interceptor-based auth, localStorage for tokens
  Testing: Karma 6.4 + Jasmine 5.1, ChromeHeadless CI (57 spec files)
  Design: "Obsidian Glass" dark-first, glassmorphism, Space Grotesk + Inter + JetBrains Mono
  Design docs: DESIGN.md (345 lines), PRODUCT.md (127 lines), UX-AUDIT.md

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope changes per feature domain
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Prefer standalone components over NgModules
    - Use Angular signals for reactive state
    - Document API contracts with backend
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include test tasks alongside implementation
  apply:
    - Follow existing code patterns
    - Generate components using Angular CLI conventions
    tdd: true
    test_command: "ng test --no-watch --browsers=ChromeHeadless --code-coverage"
  verify:
    test_command: "ng test --no-watch --browsers=ChromeHeadless --code-coverage"
    build_command: "ng build --configuration production"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner:
    command: "ng test"
    framework: Karma + Jasmine
    watch_command: "ng test --watch"
    ci_command: "ng test --no-watch --browsers=ChromeHeadless --code-coverage"
  layers:
    unit:
      available: true
      tool: "Karma + Jasmine"
    integration:
      available: true
      tool: "HttpClientTestingModule + Jasmine"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: true
    command: "ng test --no-watch --browsers=ChromeHeadless --code-coverage"
    tool: karma-coverage
    reporters: ["html", "text-summary"]
  quality:
    linter:
      available: false
      command: "—"
    type_checker:
      available: true
      command: "ng build (TypeScript strict + Angular strict templates)"
    formatter:
      available: false
      command: "—"
  existing_tests:
    count: 57
    spec_glob: "src/**/*.spec.ts"
    last_counted: 2026-07-28
    coverage: |
      Core services (12): auth, toast, translation, theme, telegram-link, notification, currency,
        i18n-sync, analytics, gmail-link, trial-banner, tour
      Core guards (3): auth, redirect-if-auth, premium
      Core interceptors (1): auth
      Core pipes (3): ft-currency, translate, category-translate
      Features — analytics (3): page + insights.service + analytics-api.service
      Features — categories (1): component
      Features — dashboard (4): stat-card, recent-activity, goals-widget, ai-insights-card
      Features — profile (4): page + personal-info + insights-card + avatar-card
      Features — settings (8): main + security + profile + preferences + category-default-selector +
        notifications + linked-accounts + linked-channel-card
      Features — transactions (1): transaction-row
      Features — referral (1): service
      Features — landing (1): hero-section
      Shared — layout (6): topbar, profile-dropdown (trigger + menu + container),
        notifications-dropdown, mobile-menu
      Shared — components (3): language-dropdown, insights-panel, empty-state
      Shared — charts (2): ft-echart component + echarts-theme.mapper
      Shared — directives (2): ft-subtle-reveal, premium-action
      Shared — UI (2): ft-modal, design-tokens
