<section class="resources" id="resources" aria-labelledby="resources-title">
  <div class="resources__inner">
    <header class="resources__header">
      <h2 class="resources__title" id="resources-title">
        {{ 'landing.resources.title' | translate }}
      </h2>
      <p class="resources__subtitle">
        {{ 'landing.resources.subtitle' | translate }}
      </p>
    </header>

    <div class="resources__grid">
      @for (resource of resources; track resource.titleKey) {
        <article class="resource-card">
          <div class="resource-card__icon" aria-hidden="true">
            <ng-icon [name]="resource.icon" size="1.5rem" />
          </div>
          <div class="resource-card__body">
            <h3 class="resource-card__title">{{ resource.titleKey | translate }}</h3>
            <p class="resource-card__description">{{ resource.descriptionKey | translate }}</p>
          </div>
          <span class="resource-card__status">
            {{ 'landing.resources.status' | translate }}
          </span>
        </article>
      }
    </div>
  </div>
</section>
