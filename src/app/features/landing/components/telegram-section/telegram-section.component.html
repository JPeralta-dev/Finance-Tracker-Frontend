<section class="telegram-section">
  <div class="telegram-section__inner">
    <div class="telegram-section__content" ftSubtleReveal="fade-up" [delay]="100">
      <div class="telegram-section__badge">
        <img src="/assets/telegram-bot-photo.png" alt="KipuBot" class="telegram-section__badge-icon" />
        {{ 'landing.telegram_section.badge' | translate }}
      </div>
      <h2 class="telegram-section__title" [innerHTML]="'landing.telegram_section.title' | translate"></h2>
      <p class="telegram-section__description">
        {{ 'landing.telegram_section.description' | translate }}
      </p>
      <a [href]="telegramBotUrl" target="_blank" class="telegram-section__btn">
        <ng-icon name="telegram" size="1.125rem" />
        {{ 'landing.telegram_section.open_bot' | translate }}
      </a>
    </div>
    <div class="telegram-section__visual" ftSubtleReveal="fade-up" [delay]="200">
      <div class="device-mockup">
        <img
          src="/assets/device-mockup_1.5x_postspark_2026-08-31_21-04-33.png"
          alt="KipuBot en Telegram"
          class="device-mockup__image"
          fetchpriority="high"
          decoding="async"
        />
        <!-- Screenshot placeholder — reemplazar mañana con captura real del bot -->
        <div class="device-mockup__screen">
          <div class="device-mockup__placeholder">
            <span class="device-mockup__placeholder-text">Screenshot del bot</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
