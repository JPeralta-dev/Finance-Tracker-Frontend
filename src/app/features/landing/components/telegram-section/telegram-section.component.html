<section class="telegram-section">
  <div class="telegram-section__inner">
    <div class="telegram-section__content" ftSubtleReveal="fade-up" [delay]="100">
      <div class="telegram-section__badge">
        <img src="/assets/kipu-mark.png" alt="Kipu" class="telegram-section__badge-icon" />
        {{ 'landing.telegram_section.badge' | translate }}
      </div>
      <h2 class="telegram-section__title" [innerHTML]="'landing.telegram_section.title' | translate"></h2>
      <p class="telegram-section__description">
        {{ 'landing.telegram_section.description' | translate }}
      </p>
      <div class="telegram-section__action-container">
        <div class="telegram-section__hint">
          <ng-icon name="telegram" size="1.25rem" class="telegram-section__hint-icon" />
          <span>{{ 'landing.telegram_section.account_hint' | translate }}</span>
        </div>
        <a routerLink="/register" class="telegram-section__btn">
          {{ 'landing.telegram_section.get_started' | translate }}
          <ng-icon name="chevronRight" size="1rem" />
        </a>
      </div>
    </div>
    <div class="telegram-section__visual" ftSubtleReveal="fade-up" [delay]="200">
      <div class="device-mockup">
        <img
          src="/assets/device-mockup_1.5x_postspark_2026-09-04_15-09-00.png"
          alt="KipuBot en Telegram"
          class="device-mockup__image"
          fetchpriority="high"
          decoding="async"
        />
      </div>
    </div>
  </div>
</section>
