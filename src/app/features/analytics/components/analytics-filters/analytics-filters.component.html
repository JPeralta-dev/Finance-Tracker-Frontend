<div class="ft-filters">
  <!-- Type Pills: All | Income | Expense -->
  <div class="ft-filters__types">
    <button
      class="ft-filters__type"
      type="button"
      [class.ft-filters__type--active]="selectedType() === 'all'"
      (click)="selectType('all')"
    >
      {{ 'analytics.filter.all' | translate }}
    </button>
    <button
      class="ft-filters__type ft-filters__type--income"
      type="button"
      [class.ft-filters__type--active]="selectedType() === 'income'"
      (click)="selectType('income')"
    >
      <ng-icon name="trendUp" size="0.85rem" aria-hidden="true" />
      {{ 'analytics.filter.income' | translate }}
    </button>
    <button
      class="ft-filters__type ft-filters__type--expense"
      type="button"
      [class.ft-filters__type--active]="selectedType() === 'expense'"
      (click)="selectType('expense')"
    >
      <ng-icon name="trendDown" size="0.85rem" aria-hidden="true" />
      {{ 'analytics.filter.expense' | translate }}
    </button>
  </div>

  <!-- Category Selector -->
  @if (categories().length > 0) {
    <div class="ft-filters__category" (clickOutside)="catOpen.set(false)">
      @if (selectedCategory()) {
        <button
          class="ft-filters__cat-chip"
          type="button"
          (click)="selectCategory(null); $event.stopPropagation()"
          [attr.aria-label]="'analytics.filter.removeCategory' | translate:{name: selectedCategory() || ''}"
        >
          <span>{{ selectedCategory() }}</span>
          <ng-icon name="x" size="0.75rem" aria-hidden="true" />
        </button>
      } @else {
        <button
          class="ft-filters__cat-btn"
          type="button"
          (click)="catOpen.set(!catOpen())"
        >
          <ng-icon name="filter" size="0.85rem" aria-hidden="true" />
          <span>{{ 'analytics.filter.category' | translate }}</span>
          <ng-icon name="chevronDown" size="0.65rem" aria-hidden="true" />
        </button>
      }
      @if (catOpen()) {
        <div class="ft-filters__cat-dropdown">
          @for (cat of categories(); track cat) {
            <button
              class="ft-filters__cat-option"
              type="button"
              (click)="selectCategory(cat); catOpen.set(false)"
            >
              {{ cat }}
            </button>
          }
        </div>
      }
    </div>
  }
</div>
